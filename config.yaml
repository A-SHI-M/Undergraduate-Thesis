artifacts_root: artifacts

mlflow:
  experiment_name: Anomaly_Detection

data_ingestion:
  download_dir: Datasets/{dataset}
  datasets:
    brain_mri:
      display_name: BRAIN_MRI
      kaggle_dataset: navoneel/brain-mri-images-for-brain-tumor-detection
    strawberry_leaf:
      display_name: STRAWBERRY_LEAF
      kaggle_dataset: ashimdj89/plant-village-strawberry
    mvtec_ad_bottle:
      display_name: MVTEC_AD_BOTTLE
      kaggle_dataset: ashimdj89/mvtec-bottle

data_transformation:
  root_dir: artifacts/data_transformation/{dataset}
  datasets:
    brain_mri:
      normal_subdir: "no"
      abnormal_subdir: "yes"
    strawberry_leaf:
      normal_subdir: Strawberry___healthy
      abnormal_subdir: Strawberry___Leaf_scorch
    mvtec_ad_bottle:
      normal_subdir: good
      abnormal_subdir: broken

model_trainer:
  root_dir: artifacts/model_trainer/{dataset}
  models_dir: artifacts/model_trainer/{dataset}/saved_models
  extra_models_dir: trainedModels/{dataset}

model_evaluation:
  root_dir: resultAnalysis/{dataset}
  comparison_dir: resultAnalysis/{dataset}/comparison

ablation_analysis:
  root_dir: ablationAnalysis/{dataset}
  comparison_dir: ablationAnalysis/{dataset}/comparison
